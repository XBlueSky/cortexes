name: Python

# Python CI —— ruff lint + 兩套 pytest（root hooks/ 與 cortex-vec）。
#
# 直接執行 scripts/run-checks.sh，也就是 pre-commit 用的同一個腳本，讓 CI 與
# 本機的關卡不會各自漂移；要調整檢查內容改那支腳本就好，不用動這裡。
#
# 這支 workflow 存在的理由：cortex-vec 有 16 個測試檔需要 chromadb / openai，
# 在沒裝重量級相依的機器上（例如開發者的 macOS）根本收集不起來，所以那些測試
# 過去實際上沒有任何自動關卡。CI 的 Linux runner 裝得起全部相依，是唯一能穩定
# 跑完整套的地方。
#
# 測試不需要真的 OPENAI_API_KEY —— 每個會碰到 OpenAI 的測試都自己 monkeypatch
# 假 key 或假 client。

on:
  push:
    branches: [plugin]
    paths:
      - 'cortex-vec/**'
      - 'hooks/**'
      - 'tests/**'
      - 'scripts/**'
      - 'ruff.toml'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'cortex-vec/**'
      - 'hooks/**'
      - 'tests/**'
      - 'scripts/**'
      - 'ruff.toml'
      - '.github/workflows/python.yml'
  workflow_dispatch: # 允許手動觸發（Actions 分頁 → Run workflow）

permissions:
  contents: read

jobs:
  test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 單一版本。cortex-vec 的相依把實際下限拉到 3.10（openai 與
          # python-frontmatter 都要求 >= 3.10），pyproject 的 requires-python
          # 也已對齊，所以這裡測目前的穩定版本即可。
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cortex-vec/pyproject.toml

      - name: Install cortex-vec + test tooling
        run: |
          python -m pip install --upgrade pip
          # 可編輯安裝：pythonpath 由 pyproject 的 pytest 設定處理，這裡要的是
          # chromadb / openai / jieba 等執行期相依，以及 dev extra 的 pytest。
          python -m pip install -e "cortex-vec[dev]" ruff

      - name: Verify lint tooling is present
        # run-checks.sh 在找不到 ruff 時會印訊息並「跳過」lint 而非失敗，這在
        # 本機是刻意的方便，但在 CI 會讓 lint 靜默消失。這裡先擋一道，確保
        # 下一步真的有跑到 lint。
        run: ruff --version

      - name: ruff + pytest (scripts/run-checks.sh)
        run: ./scripts/run-checks.sh
