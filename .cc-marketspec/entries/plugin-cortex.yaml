# Presentation overlay for cortex. Every field is optional — native data
# already yields a valid manifest; this only enriches it.
# yaml-language-server: $schema=../../node_modules/@xbluesky/cc-marketspec/schemas/entry.schema.json

group: knowledge

tagline: Knowledge doesn't sit. It compounds.

intro: >
  Cortex is a personal memory layer for Claude Code. Every session automatically records
  commits, findings, and decisions, which can later be distilled into refined notes and
  retrieved with mixed-language semantic search. The vault is plain markdown + git as the
  source of truth; the vector store is just a rebuildable derived index. Built for anyone
  who wants working memory to compound across sessions instead of resetting every time.

skills:
  - name: cortex-evolve
    trigger: When the user wants to save knowledge to the vault ("存到 cortex", "記一下"), or when the session-suggest hook recommends saving.
    examples:
      - "save to cortex"
      - "note this decision down"
      - "remember this"
  - name: cortex-query
    trigger: When the user wants to search the vault ("查 cortex", "之前有記過"), or proactively before answering any question about existing projects or internal tooling.
    examples:
      - "check cortex for DSM notes"
      - "have I written about this before"
      - "what did I write about cortex-vec"
  - name: cortex-distill
    trigger: When the user wants to distill Raw session records into Notes/Projects ("提煉", "整理 raw", "distill").
    examples:
      - "distill this week's raw"
      - "distill raw records"
  - name: cortex-broadcast
    trigger: After a Raw has been distilled, to fuse it into related existing pages ("broadcast", "compound this into the vault"), or auto-dispatched at the end of the distill flow.
    examples:
      - "broadcast"
      - "process broadcast queue"
  - name: cortex-takeoff
    trigger: When context is running low and work needs to hand off to the next session ("交接", "takeoff", "交棒"). Produces a temporary hand-off baton that's never committed or indexed.
    examples:
      - "hand off to the next session"
      - "takeoff resume"
      - "takeoff done"
  - name: using-cortex
    trigger: Triggers unconditionally at session start or on any non-trivial request — checks whether the vault already has relevant memory before guessing, asking, or re-exploring.
    examples:
      - "(auto-triggered at session start)"

commands:
  - name: genesis
    examples:
      - "/cortex:genesis /synosrc/misc/cortex"
      - "/cortex:genesis ~/cortex"
  - name: evolve
    examples:
      - "/cortex:evolve"
  - name: distill
    examples:
      - "/cortex:distill this week"
      - "/cortex:distill 2026-06-30"
  - name: broadcast
    examples:
      - "/cortex:broadcast --list"
  - name: takeoff
    examples:
      - "/cortex:takeoff"
      - "/cortex:takeoff resume"
      - "/cortex:takeoff done"

hooks:
  - event: SessionEnd
    why: Auto-generates a full report (commits, findings, decisions) and saves it to the vault's Raw/ on session end — the entry point for automatic capture.
  - event: SessionStart
    why: Detects the current repo at session start and injects relevant vault memory into context, so Claude starts with prior background already loaded.

tips:
  - Let cortex-query search the vault before answering questions about existing projects or internal tooling — far cheaper than re-exploring or asking.
  - distill automatically dispatches broadcast afterward to fuse new knowledge into existing pages; no need to run it manually.
  - The vault is the source of truth (markdown + git); the vector store can always be rebuilt with /cortex:genesis.

traps:
  - The takeoff baton is temporary scaffolding — it is never committed, distilled, broadcast, or indexed. Don't rely on it as the only place long-term knowledge lives.
  - Semantic search requires OPENAI_API_KEY and the cortex-vec CLI installed; missing either means cortex-query can't retrieve results.
