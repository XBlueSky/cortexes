[project]
name = "cortex-vec"
version = "0.2.0"
description = "Vector store CLI for the cortex vault"
requires-python = ">=3.8"
dependencies = [
    "chromadb",
    "python-frontmatter",
    "pysqlite3-binary",
]

[project.scripts]
cortex-vec = "cortex_vec.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
