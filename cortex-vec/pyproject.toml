[project]
name = "cortex-vec"
version = "0.7.0"
description = "Vector store CLI for the cortex vault"
requires-python = ">=3.8"
dependencies = [
    "chromadb",
    "openai",
    "python-frontmatter",
    "pysqlite3-binary; sys_platform == 'linux'",
    "rank-bm25",
    "jieba",
    "snowballstemmer",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cortex-vec = "cortex_vec.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
