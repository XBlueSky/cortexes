# Presentation overlay for cortex. Every field is optional — native data
# already yields a valid manifest; this only enriches it.
# yaml-language-server: $schema=node_modules/@xbluesky/cc-marketspec/schemas/entry.schema.json

group: knowledge

tagline: 把每次 session 變成可搜尋的個人知識庫 — 自動記錄、提煉、語意檢索

intro: >
  Cortex 是 Claude Code 的個人記憶層。每次 session 結束自動記錄 commits、發現與決策，
  之後可提煉成精煉筆記、用中英混合語意搜尋檢索。Vault 是純 markdown + git 的 source of
  truth，vector store 只是可重建的衍生索引。適合想把工作記憶長期累積、跨 session 復用的人。

skills:
  - name: cortex-evolve
    trigger: 使用者要把知識存進 vault（「存到 cortex」「記一下」），或 session-suggest hook 建議存檔時。
    examples:
      - "存到 cortex"
      - "記一下這個決策"
      - "save to cortex"
  - name: cortex-query
    trigger: 使用者要查 vault（「查 cortex」「之前有記過」），或回答任何關於既有專案／內部工具的問題「前」，主動先搜尋。
    examples:
      - "查 cortex 有沒有 DSM 相關筆記"
      - "之前有記過這個嗎"
      - "what did I write about cortex-vec"
  - name: cortex-distill
    trigger: 使用者要把 Raw session 記錄提煉成 Notes/Projects（「提煉」「整理 raw」「distill」）。
    examples:
      - "提煉這週的 raw"
      - "distill raw records"
  - name: cortex-broadcast
    trigger: 一個 Raw 已 distill 後，要把它融合進相關既有頁面（「broadcast」「compound this into the vault」），或 distill 流程末段自動 dispatch。
    examples:
      - "broadcast"
      - "process broadcast queue"
  - name: cortex-takeoff
    trigger: context 快滿要交接給下個 session（「交接」「takeoff」「交棒」）。產出不進 git、不索引的暫時 hand-off baton。
    examples:
      - "交接給下個 session"
      - "takeoff resume"
      - "takeoff done"
  - name: using-cortex
    trigger: session 開始或每個非瑣碎請求時無條件觸發 — 在猜測、追問或重新探索「前」，先確認 vault 是否已有相關記憶。
    examples:
      - "（session 開始自動觸發）"

commands:
  - name: genesis
    examples:
      - "/cortex:genesis /synosrc/misc/cortex"
      - "/cortex:genesis ~/cortex"
  - name: evolve
    examples:
      - "/cortex:evolve"
  - name: distill
    examples:
      - "/cortex:distill this week"
      - "/cortex:distill 2026-06-30"
  - name: broadcast
    examples:
      - "/cortex:broadcast --list"
  - name: takeoff
    examples:
      - "/cortex:takeoff"
      - "/cortex:takeoff resume"
      - "/cortex:takeoff done"

hooks:
  - event: SessionEnd
    why: session 結束時自動產出完整報告（commits、發現、決策）並存進 vault 的 Raw/，是自動記錄的入口。
  - event: SessionStart
    why: 開 session 時偵測當前 repo，把相關 vault 記憶注入 context，讓 Claude 一開始就有既有背景。

tips:
  - 回答關於既有專案或內部工具的問題前，讓 cortex-query 先搜尋 vault — 比重新探索或追問便宜得多。
  - distill 完成後會自動 dispatch broadcast，把新知識融進既有頁面；不必手動再跑一次。
  - Vault 是 source of truth（markdown + git），vector store 可隨時用 /cortex:genesis 重建索引。

traps:
  - takeoff baton 是暫時 scaffolding：它「不會」被 commit、distill、broadcast 或索引 — 別把長期知識只寫在 baton 裡。
  - 語意搜尋需要 OPENAI_API_KEY 與已安裝的 cortex-vec CLI；缺任一則 cortex-query 無法檢索。
