name: Bug Report
description: Report a problem or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please don't use this for security issues —
        report those through [SECURITY.md](../blob/plugin/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest steps that reproduce it.
      placeholder: |
        1. Run `/cortex:...`
        2. ...
        3. See error ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part is affected?
      options:
        - cortex-vec (CLI / retrieval)
        - commands / skills
        - hooks (SessionStart / SessionEnd)
        - website (site/)
        - other / not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Claude Code / plugin version.
      placeholder: |
        - OS: macOS 15
        - Python: 3.12
        - cortex version: 0.23.0
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / error output
      render: shell
    validations:
      required: false
