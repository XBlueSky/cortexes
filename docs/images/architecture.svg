<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
  <title id="t">Cortexes architecture</title>
  <desc id="d">Three layers. The Claude Code plugin (hooks, skills, commands) reads and writes the vault. The vault is markdown in git and is the source of truth. A derived index in ~/.cortex, maintained by the cortex-vec CLI with ChromaDB and BM25, can be rebuilt from the vault. OpenAI provides embeddings. The transcript filter may ask Claude, through your own claude -p, whether a very large block is a log.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .title { font-size: 18px; font-weight: 700; fill: #111827; }
    .layer { font-size: 14px; font-weight: 700; }
    .sub { font-size: 12px; }
    .h { font-size: 13px; font-weight: 700; }
    .p { font-size: 12px; fill: #4b5563; }
    .lbl { font-size: 11.5px; fill: #4b5563; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="559" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text class="title" x="30" y="36">Architecture</text>

  <!-- layer 1: the plugin -->
  <rect x="56" y="56" width="704" height="150" rx="12" fill="#eef2ff" stroke="#818cf8"/>
  <text class="layer" x="76" y="80">Claude Code plugin</text>
  <text class="sub mono" x="740" y="80" text-anchor="end" fill="#4f46e5" style="fill:#4f46e5">branch: plugin</text>

  <rect x="76" y="94" width="224" height="96" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text class="h" x="90" y="116">Hooks</text>
  <text class="p" x="90" y="138">SessionStart: band menu</text>
  <text class="p" x="90" y="156">SessionEnd: filter, redact,</text>
  <text class="p" x="90" y="174">write the session to Raw/</text>

  <rect x="316" y="94" width="224" height="96" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text class="h" x="330" y="116">Skills <tspan style="font-weight:400;fill:#6b7280">· auto-triggered</tspan></text>
  <text class="p" x="330" y="138">query · evolve · distill</text>
  <text class="p" x="330" y="156">broadcast · takeoff</text>
  <text class="p" x="330" y="174">using-cortex</text>

  <rect x="556" y="94" width="184" height="96" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text class="h" x="570" y="116">Commands <tspan class="mono" style="font-weight:400;fill:#6b7280;font-size:12px">/cortexes:*</tspan></text>
  <text class="p" x="570" y="138">genesis · query · evolve</text>
  <text class="p" x="570" y="156">distill · broadcast</text>
  <text class="p" x="570" y="174">takeoff</text>

  <!-- layer 2: the vault -->
  <rect x="56" y="246" width="704" height="100" rx="12" fill="#ecfdf5" stroke="#34d399"/>
  <text class="layer" x="76" y="270">Vault</text>
  <text class="sub" x="122" y="270" style="fill:#047857">markdown + git · the source of truth</text>
  <text class="sub mono" x="740" y="270" text-anchor="end" style="fill:#047857">branch: main</text>
  <g>
    <rect x="76" y="296" width="45" height="26" rx="6" fill="#ffffff" stroke="#a7f3d0"/><text class="sub mono" x="98.5" y="313" text-anchor="middle" style="fill:#065f46">Raw/</text>
    <rect x="131" y="296" width="59" height="26" rx="6" fill="#ffffff" stroke="#a7f3d0"/><text class="sub mono" x="160.5" y="313" text-anchor="middle" style="fill:#065f46">Notes/</text>
    <rect x="200" y="296" width="81" height="26" rx="6" fill="#ffffff" stroke="#a7f3d0"/><text class="sub mono" x="240.5" y="313" text-anchor="middle" style="fill:#065f46">Projects/</text>
    <rect x="291" y="296" width="81" height="26" rx="6" fill="#ffffff" stroke="#a7f3d0"/><text class="sub mono" x="331.5" y="313" text-anchor="middle" style="fill:#065f46">_index.md</text>
    <rect x="382" y="296" width="59" height="26" rx="6" fill="#ffffff" stroke="#a7f3d0"/><text class="sub mono" x="411.5" y="313" text-anchor="middle" style="fill:#065f46">log.md</text>
  </g>
  <text class="p" x="740" y="314" text-anchor="end">open in Obsidian or any editor</text>

  <!-- layer 3: the derived index -->
  <rect x="56" y="386" width="704" height="140" rx="12" fill="#ecfeff" stroke="#22d3ee"/>
  <text class="layer" x="76" y="410">Derived index</text>
  <text class="sub" x="182" y="410" style="fill:#0e7490">rebuildable from the vault at any time</text>
  <text class="sub mono" x="740" y="410" text-anchor="end" style="fill:#0e7490">~/.cortex</text>

  <rect x="76" y="430" width="180" height="76" rx="8" fill="#ffffff" stroke="#a5f3fc"/>
  <text class="h mono" x="90" y="454">cortex-vec</text>
  <text class="p" x="90" y="474">Python CLI: index,</text>
  <text class="p" x="90" y="492">search, Raw queues</text>

  <rect x="286" y="424" width="454" height="88" rx="8" fill="#f0fdff" stroke="#a5f3fc" stroke-dasharray="4 3"/>
  <rect x="302" y="436" width="206" height="64" rx="8" fill="#ffffff" stroke="#a5f3fc"/>
  <text class="h" x="316" y="459">ChromaDB</text>
  <text class="p" x="316" y="479">body + bilingual summary</text>
  <text class="p" x="316" y="495" style="font-size:11px">two vectors per page</text>
  <rect x="520" y="436" width="206" height="64" rx="8" fill="#ffffff" stroke="#a5f3fc"/>
  <text class="h" x="534" y="459">BM25</text>
  <text class="p" x="534" y="479">exact terms and IDs</text>
  <text class="p" x="534" y="495" style="font-size:11px">jieba tokenizer for CJK</text>
  <line class="flow" x1="258" y1="468" x2="283" y2="468" marker-end="url(#arrow)"/>

  <!-- inter-layer edges -->
  <line class="flow" x1="188" y1="208" x2="188" y2="243" marker-end="url(#arrow)"/>
  <text class="lbl" x="196" y="230">records sessions</text>
  <line class="flow" x1="428" y1="209" x2="428" y2="243" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="lbl" x="436" y="230">read and write pages</text>
  <line class="flow" x1="166" y1="348" x2="166" y2="383" marker-end="url(#arrow)"/>
  <text class="lbl" x="174" y="370">rebuild · upsert</text>

  <!-- search path runs down the left margin, past the vault -->
  <path class="flow" d="M56,150 H36 V468 H73" marker-end="url(#arrow)"/>
  <text class="lbl" transform="translate(30 310) rotate(-90)" text-anchor="middle">cortex-vec search</text>

  <!-- right column -->
  <rect x="780" y="56" width="190" height="150" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="5 4"/>
  <text class="h" x="796" y="80">Transcript classifier</text>
  <text class="p" x="796" y="98" style="font-size:11px">optional · SessionEnd only</text>
  <text class="p mono" x="796" y="124" style="font-size:11px">claude -p --model sonnet</text>
  <text class="p" x="796" y="142" style="font-size:11px">your own Claude Code login</text>
  <text class="p" x="796" y="164" style="font-size:11px">blocks over 12 KB: log</text>
  <text class="p" x="796" y="180" style="font-size:11px">or content? (5 calls max)</text>
  <text class="p mono" x="796" y="198" style="font-size:10.5px">CORTEX_NO_CLASSIFIER=1</text>
  <line class="flow" x1="778" y1="131" x2="763" y2="131" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <rect x="780" y="386" width="190" height="140" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text class="h" x="796" y="410">OpenAI API</text>
  <text class="p mono" x="796" y="436" style="font-size:11px">text-embedding-3-small</text>
  <text class="p" x="796" y="452" style="font-size:11px">page and query vectors</text>
  <text class="p mono" x="796" y="478" style="font-size:11px">gpt-5.4-mini</text>
  <text class="p" x="796" y="494" style="font-size:11px">summaries, optional rerank</text>
  <text class="p" x="796" y="514" style="font-size:11px">absent: BM25-only search</text>
  <line class="flow" x1="778" y1="456" x2="763" y2="456" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</svg>
