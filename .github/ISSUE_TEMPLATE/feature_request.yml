name: Feature Request
description: Propose a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What need or pain point motivates this?
      placeholder: I often need to..., but currently...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: How would you like it to work?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Related component
      options:
        - cortex-vec (CLI / retrieval)
        - commands / skills
        - hooks
        - website (site/)
        - other / cross-cutting
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
